name: Flutter CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java (required for Android builds)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Analyze code (lint check)
      - name: Analyze Code
        run: flutter analyze

#      # 6. Run tests
#      - name: Run Tests
#        run: flutter test

      # 7. Build APK
      - name: Build APK
        run: flutter build apk --release --no-shrink

      # 8. Upload APK as artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk